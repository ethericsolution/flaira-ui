{% extends "layouts/base.njk" %} {% block title %}Profile{% endblock %} {% block
content %}
<section class="container">
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4"
  >
    <div class="mb-3 mb-md-0">
      <h1 class="h2 fw-bold text-dark mb-2">Profile</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item">
            <a href="/" class="text-decoration-none">Home</a>
          </li>
          <li class="breadcrumb-item active text-muted" aria-current="page">
            Profile
          </li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-4 mb-4">
      <div class="card border-0 shadow">
        <div class="card-body text-center">
          <img
            src="https://placehold.co/120x120"
            class="rounded-circle mb-3"
            alt="Profile"
            width="120"
            height="120"
          />
          <h5 class="fw-bold mb-1">Admin User</h5>
          <p class="text-muted mb-3">Administrator</p>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-primary btn-sm">
              <i class="bi bi-camera me-1"></i>
              Change Photo
            </button>
            <button class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-download me-1"></i>
              Download
            </button>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow mt-4">
        <div class="card-header bg-white border-0 py-3">
          <h6 class="card-title mb-0">Account Information</h6>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <small class="text-muted">Member Since</small>
            <div class="fw-semibold">January 15, 2023</div>
          </div>
          <div class="mb-3">
            <small class="text-muted">Last Login</small>
            <div class="fw-semibold">2 hours ago</div>
          </div>
          <div class="mb-3">
            <small class="text-muted">Account Status</small>
            <div><span class="badge bg-success">Active</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card border-0 shadow">
        <div class="card-header bg-white border-0 py-3">
          <h5 class="card-title mb-0">Edit Profile</h5>
        </div>
        <div class="card-body">
          <form>
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" value="Admin" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" value="User" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                value="admin@example.com"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input
                type="tel"
                class="form-control"
                value="+1 (555) 123-4567"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Bio</label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="Tell us about yourself..."
              >
Administrator with full system access and management privileges.</textarea
              >
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                Update Profile
              </button>
              <button type="reset" class="btn btn-outline-secondary">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
