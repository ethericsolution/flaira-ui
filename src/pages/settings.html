{% extends "layouts/base.njk" %} {% block title %}Settings{% endblock %} {%
block content %}
<section class="container">
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4"
  >
    <div class="mb-3 mb-md-0">
      <h1 class="h2 fw-bold text-dark mb-2">Settings</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item">
            <a href="/" class="text-decoration-none">Home</a>
          </li>
          <li class="breadcrumb-item active text-muted" aria-current="page">
            Settings
          </li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-3 mb-4">
      <div class="card border-0 shadow overflow-hidden">
        <div class="card-body p-0">
          <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action active">
              <i class="bi bi-sliders me-2"></i>
              General Settings
            </a>
            <a href="#" class="list-group-item list-group-item-action">
              <i class="bi bi-shield-lock me-2"></i>
              Security
            </a>
            <a href="#" class="list-group-item list-group-item-action">
              <i class="bi bi-bell me-2"></i>
              Notifications
            </a>
            <a href="#" class="list-group-item list-group-item-action">
              <i class="bi bi-credit-card me-2"></i>
              Payment
            </a>
            <a href="#" class="list-group-item list-group-item-action">
              <i class="bi bi-database me-2"></i>
              Database
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="card border-0 shadow">
        <div class="card-header bg-white border-0 py-3">
          <h5 class="card-title mb-0">General Settings</h5>
        </div>
        <div class="card-body">
          <form>
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Site Name</label>
                <input type="text" class="form-control" value="AdminKit" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Site URL</label>
                <input
                  type="url"
                  class="form-control"
                  value="https://admin.example.com"
                />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Site Description</label>
              <textarea class="form-control" rows="3">
Modern admin dashboard template</textarea
              >
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Timezone</label>
                <select class="form-select">
                  <option>UTC-5 (Eastern Time)</option>
                  <option>UTC-8 (Pacific Time)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Date Format</label>
                <select class="form-select">
                  <option>MM/DD/YYYY</option>
                  <option>DD/MM/YYYY</option>
                  <option>YYYY-MM-DD</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Site Logo</label>
              <div class="d-flex align-items-center gap-3">
                <img
                  src="https://placehold.co/80x80"
                  alt="Logo"
                  class="rounded"
                  width="80"
                  height="80"
                />
                <div>
                  <input type="file" class="form-control" />
                  <div class="form-text">Recommended size: 80x80 pixels</div>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
              <button type="reset" class="btn btn-outline-secondary">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
