<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AdminKit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/css/styles.min.css" />
    <style>
      .auth-container {
        min-height: 100vh;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .auth-card {
        background: white;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        overflow: hidden;
      }

      .auth-header {
        background: white;
        padding: 2rem 2rem 1rem;
        text-align: center;
        border-bottom: 1px solid #f1f5f9;
      }

      .auth-body {
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <div class="d-flex align-items-center justify-content-center mb-3">
            <i class="bi bi-speedometer2 fs-2 text-primary me-2"></i>
            <h4 class="mb-0 fw-bold text-dark">AdminKit</h4>
          </div>
          <h5 class="mb-1 fw-semibold text-dark">Welcome Back</h5>
          <p class="mb-0 text-muted">Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <div class="auth-body">
          <form>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter your password"
                  required
                />
                <button
                  class="btn btn-outline-primary"
                  type="button"
                  id="togglePassword"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-3 d-flex justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" />
                <label class="form-check-label" for="remember">
                  Remember me
                </label>
              </div>
              <a
                href="forgot-password.html"
                class="text-decoration-none text-primary fw-medium"
                >Forgot password?</a
              >
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 mb-3 fw-medium"
            >
              Sign In
            </button>

            <div class="text-center">
              <span class="text-muted">Don't have an account? </span>
              <a
                href="register.html"
                class="text-decoration-none fw-semibold text-primary"
                >Sign up</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      document
        .getElementById("togglePassword")
        .addEventListener("click", function () {
          const passwordInput = document.getElementById("password");
          const icon = this.querySelector("i");

          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
          } else {
            passwordInput.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
          }
        });

      // Form submission
      document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();
        // Add your login logic here
        console.log("Login attempted");
      });
    </script>
  </body>
</html>
