<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - AdminKit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/css/styles.min.css" />
    <style>
      .auth-container {
        min-height: 100vh;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .auth-card {
        background: white;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        border: 1px solid #e2e8f0;
        width: 100%;
        max-width: 400px;
      }

      .auth-header {
        background: white;
        padding: 2rem 2rem 1rem;
        text-align: center;
        border-bottom: 1px solid #f1f5f9;
      }

      .auth-body {
        padding: 2rem;
      }

      .form-control:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
      }

      .success-message {
        display: none;
        text-align: center;
        padding: 2rem;
      }

      .success-icon {
        font-size: 3rem;
        color: #10b981;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <div class="d-flex align-items-center justify-content-center mb-3">
            <i class="bi bi-speedometer2 fs-2 text-primary me-2"></i>
            <h4 class="mb-0 fw-bold text-dark">AdminKit</h4>
          </div>
          <h5 class="mb-1 fw-semibold text-dark">Reset Password</h5>
          <p class="mb-0 text-muted">We'll send you a reset link</p>
        </div>

        <!-- Reset Form -->
        <div class="auth-body" id="resetForm">
          <form>
            <div class="mb-4">
              <p class="text-muted text-center">
                Enter your email address and we'll send you instructions to
                reset your password.
              </p>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-medium text-dark"
                >Email Address</label
              >
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-envelope text-muted"></i>
                </span>
                <input
                  type="email"
                  class="form-control border-start-0"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 mb-3 fw-medium"
            >
              <i class="bi bi-send me-2"></i>
              Send Reset Link
            </button>

            <div class="text-center">
              <a
                href="login.html"
                class="text-decoration-none fw-semibold text-primary"
              >
                <i class="bi bi-arrow-left me-1"></i>
                Back to Login
              </a>
            </div>
          </form>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
          <div class="success-icon">
            <i class="bi bi-check-circle-fill"></i>
          </div>
          <h5 class="fw-semibold mb-2 text-dark">Check Your Email</h5>
          <p class="text-muted mb-3">
            We've sent a password reset link to your email address. Please check
            your inbox and follow the instructions.
          </p>
          <a href="login.html" class="btn btn-primary fw-medium">
            Return to Login
          </a>
        </div>
      </div>
    </div>

    <script>
      // Form submission
      document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();

        // Show success message
        document.getElementById("resetForm").style.display = "none";
        document.getElementById("successMessage").style.display = "block";

        // In a real application, you would send the reset request to your backend here
        console.log(
          "Password reset requested for:",
          document.getElementById("email").value
        );
      });
    </script>
  </body>
</html>
