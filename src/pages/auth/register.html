<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AdminKit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/css/styles.min.css" />
    <style>
      .auth-container {
        min-height: 100vh;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .auth-card {
        background: white;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        border: 1px solid #e2e8f0;
        width: 100%;
        max-width: 450px;
      }

      .auth-header {
        background: white;
        padding: 2rem 2rem 1rem;
        text-align: center;
        border-bottom: 1px solid #f1f5f9;
      }

      .auth-body {
        padding: 2rem;
      }

      .form-control:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
      }

      .password-strength {
        height: 4px;
        background: #e5e7eb;
        border-radius: 2px;
        margin-top: 0.5rem;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <div class="d-flex align-items-center justify-content-center mb-3">
            <i class="bi bi-speedometer2 fs-2 text-primary me-2"></i>
            <h4 class="mb-0 fw-bold text-dark">AdminKit</h4>
          </div>
          <h5 class="mb-1 fw-semibold text-dark">Create Account</h5>
          <p class="mb-0 text-muted">Join us today</p>
        </div>

        <!-- Register Form -->
        <div class="auth-body">
          <form>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label fw-medium text-dark"
                  >First Name</label
                >
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-person text-muted"></i>
                  </span>
                  <input
                    type="text"
                    class="form-control border-start-0"
                    id="firstName"
                    placeholder="First name"
                    required
                  />
                </div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label fw-medium text-dark"
                  >Last Name</label
                >
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-person text-muted"></i>
                  </span>
                  <input
                    type="text"
                    class="form-control border-start-0"
                    id="lastName"
                    placeholder="Last name"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-medium text-dark"
                >Email Address</label
              >
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-envelope text-muted"></i>
                </span>
                <input
                  type="email"
                  class="form-control border-start-0"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-medium text-dark"
                >Password</label
              >
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-lock text-muted"></i>
                </span>
                <input
                  type="password"
                  class="form-control border-start-0"
                  id="password"
                  placeholder="Create password"
                  required
                />
                <button
                  class="btn btn-outline-secondary border-start-0 bg-white"
                  type="button"
                  id="togglePassword"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="password-strength">
                <div
                  class="password-strength-bar"
                  id="passwordStrengthBar"
                ></div>
              </div>
              <div class="form-text" id="passwordStrengthText">
                Password strength: None
              </div>
            </div>

            <div class="mb-3">
              <label
                for="confirmPassword"
                class="form-label fw-medium text-dark"
                >Confirm Password</label
              >
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-lock text-muted"></i>
                </span>
                <input
                  type="password"
                  class="form-control border-start-0"
                  id="confirmPassword"
                  placeholder="Confirm password"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="terms"
                  required
                />
                <label class="form-check-label text-muted" for="terms">
                  I agree to the
                  <a href="#" class="text-decoration-none text-primary"
                    >Terms of Service</a
                  >
                  and
                  <a href="#" class="text-decoration-none text-primary"
                    >Privacy Policy</a
                  >
                </label>
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 mb-3 fw-medium"
            >
              <i class="bi bi-person-plus me-2"></i>
              Create Account
            </button>

            <div class="text-center">
              <span class="text-muted">Already have an account? </span>
              <a
                href="login.html"
                class="text-decoration-none fw-semibold text-primary"
                >Sign in</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      document
        .getElementById("togglePassword")
        .addEventListener("click", function () {
          const passwordInput = document.getElementById("password");
          const icon = this.querySelector("i");

          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
          } else {
            passwordInput.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
          }
        });

      // Password strength indicator
      document
        .getElementById("password")
        .addEventListener("input", function () {
          const password = this.value;
          const strengthBar = document.getElementById("passwordStrengthBar");
          const strengthText = document.getElementById("passwordStrengthText");

          let strength = 0;
          let text = "None";
          let color = "#ef4444";

          if (password.length >= 8) strength += 25;
          if (password.match(/[a-z]/) && password.match(/[A-Z]/))
            strength += 25;
          if (password.match(/\d/)) strength += 25;
          if (password.match(/[^a-zA-Z\d]/)) strength += 25;

          if (strength >= 75) {
            text = "Strong";
            color = "#10b981";
          } else if (strength >= 50) {
            text = "Medium";
            color = "#f59e0b";
          } else if (strength >= 25) {
            text = "Weak";
            color = "#f59e0b";
          } else {
            text = "None";
            color = "#ef4444";
          }

          strengthBar.style.width = strength + "%";
          strengthBar.style.background = color;
          strengthText.textContent = "Password strength: " + text;
          strengthText.style.color = color;
        });

      // Form submission
      document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }

        // Add your registration logic here
        console.log("Registration attempted");
      });
    </script>
  </body>
</html>
